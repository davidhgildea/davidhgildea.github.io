title: Simplified Bible
description: "The Simplified Bible: a simplified English version of the Holy Bible. Free to read and listen to online."
lang: en
author: Simplified Bible
remote_theme: just-the-docs/just-the-docs
url: https://simplified.bible
#logo: "/assets/logo/logo_big.png"

# Set a path/url to a favicon that will be displayed by the browser
favicon_ico: "/assets/logo/favicon.ico"

# Aux links (top right corner)
# aux_links:
# "Learn English through Scripture":
#   - "https://www.lexiverses.com"
# aux_links_new_tab: true

# Footer content
footer_content: 'Copyright &copy; 2024&ndash;2026 Simplified Bible | <a href="/about/">About</a> | <a href="/about/#quoting">Usage terms</a> | <a href="/privacy">Privacy Policy</a> | <a href="/terms">Terms of Service</a>'

# Enable or disable the site search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Google Analytics Tracking (optional)
ga_tracking: G-GS1PJ45T73
ga_tracking_anonymize_ip: true

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
